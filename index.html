<!DOCTYPE html>
<html lang="ko" class="locked">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>헬스케어파트 컨트롤룸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Gothic+A1:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-2:#F7F9F8;
    --ink:#181A19;
    --ink-soft:#565B58;
    --muted:#8B9089;
    --line:rgba(24,26,25,0.11);
    --card:#FFFFFF;
    --blue:#4E93BE;
    --blue-ink:#0E3A52;
    --blue-tint:#E4F0F6;
    --blue-light:#8FC1DD;
    --green:#7CA986;
    --green-ink:#1F3324;
    --green-tint:#E7F1E9;
    --green-light:#B7D6BD;
    --neutral:#C7C2B4;
    --neutral-dark:#9B9587;
    --good:#4E93BE;
    --warn:#7CA986;
    --crit:#B7AE9C;
    --spot-a:#4E93BE;
    --spot-b:#7CA986;
    --shadow: 0 1px 0 rgba(24,26,25,0.03);
    --radius-lg:26px;
    --radius-md:16px;
    --radius-sm:10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#131615;
      --paper-2:#1A1E1C;
      --ink:#F2F4F2;
      --ink-soft:#C6CBC6;
      --muted:#8E9490;
      --line:rgba(242,244,242,0.12);
      --card:#1D2120;
      --blue:#7FBBDD;
      --blue-ink:#DCEEF7;
      --blue-tint:#1E3542;
      --blue-light:#4E93BE;
      --green:#9AC5A2;
      --green-ink:#E4F1E6;
      --green-tint:#20302A;
      --green-light:#5E8C68;
      --neutral:#4A4842;
      --neutral-dark:#6E695D;
      --good:#7FBBDD;
      --warn:#9AC5A2;
      --crit:#8C8778;
      --spot-a:#7FBBDD;
      --spot-b:#9AC5A2;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --paper:#131615;
    --paper-2:#1A1E1C;
    --ink:#F2F4F2;
    --ink-soft:#C6CBC6;
    --muted:#8E9490;
    --line:rgba(242,244,242,0.12);
    --card:#1D2120;
    --blue:#7FBBDD;
    --blue-ink:#DCEEF7;
    --blue-tint:#1E3542;
    --blue-light:#4E93BE;
    --green:#9AC5A2;
    --green-ink:#E4F1E6;
    --green-tint:#20302A;
    --green-light:#5E8C68;
    --neutral:#4A4842;
    --neutral-dark:#6E695D;
    --good:#7FBBDD;
    --warn:#9AC5A2;
    --crit:#8C8778;
    --spot-a:#7FBBDD;
    --spot-b:#9AC5A2;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Gothic A1","Bricolage Grotesque",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-family:"Bricolage Grotesque","Gothic A1",system-ui,sans-serif; font-variant-numeric:tabular-nums; }
  h1,h2,h3{ font-family:"Bricolage Grotesque","Gothic A1",system-ui,sans-serif; text-wrap:balance; margin:0; }

  .shell{ max-width:1180px; margin:0 auto; padding:20px 20px 80px; }

  /* Top bar */
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; padding:10px 4px 22px; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{ width:34px; height:34px; border-radius:9px; background:var(--blue); display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; font-family:"Bricolage Grotesque"; font-size:16px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);}
  .brand .name{ font-weight:800; font-size:16px; letter-spacing:-0.01em; }
  .brand .sub{ font-size:12px; color:var(--muted); font-weight:500; }

  .tabswitch{ display:inline-flex; padding:4px; gap:4px; background:var(--paper-2); border-radius:999px; border:1px solid var(--line); }
  .tabswitch button{ appearance:none; border:none; background:transparent; color:var(--ink-soft); font-family:inherit; font-weight:700; font-size:13.5px; padding:9px 18px; border-radius:999px; cursor:pointer; transition:background .15s ease, color .15s ease; white-space:nowrap; }
  @media (max-width:520px){ .tabswitch button{ font-size:11.5px; padding:8px 11px; } .brand .sub{ display:none; } }
  .tabswitch button.active{ background:var(--ink); color:var(--paper); }
  .tabswitch button:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }

  .yearbadge{ font-size:12px; font-weight:800; padding:6px 12px; border-radius:999px; background:var(--blue-tint); color:var(--blue-ink); border:1px solid var(--line); }

  .view{ display:none; }
  .view.active{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
  @media (prefers-reduced-motion: reduce){ .view.active{ animation:none; } }

  section.block{ margin-bottom:34px; }
  .block-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .block-head h2{ font-size:19px; font-weight:800; letter-spacing:-0.01em; }
  .block-head .desc{ font-size:12.5px; color:var(--muted); font-weight:500; }

  /* Mosaic stat cards */
  .mosaic{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:820px){ .mosaic{ grid-template-columns:repeat(2,1fr); } }
  .tile{ border-radius:var(--radius-lg); padding:20px; position:relative; overflow:hidden; min-height:118px; display:flex; flex-direction:column; justify-content:space-between; box-shadow:var(--shadow); }
  .tile .tlabel{ font-size:12px; font-weight:700; letter-spacing:0.01em; opacity:0.82; }
  .tile .tval{ font-size:32px; font-weight:800; letter-spacing:-0.02em; line-height:1; }
  .tile .tfoot{ font-size:11.5px; font-weight:600; opacity:0.75; }
  .tile{ background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .tile.blue,.tile.green{ border-top:3px solid transparent; }
  .tile.blue{ border-top-color:var(--blue); background:var(--blue-tint); }
  .tile.green{ border-top-color:var(--green); background:var(--green-tint); }
  .tile .ticon{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; margin-bottom:2px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04); }
  .tile.blue .ticon,.tile.green .ticon,.tile.neutral .ticon{ background:var(--card); color:var(--ink-soft); }
  .tile .tlabel{ color:var(--ink-soft); }
  .tile .tfoot{ color:var(--muted); }

  /* Cards / tables */
  .card-surface{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md); }

  .toolbar{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .search{ flex:1; min-width:200px; display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:9px 14px; }
  .search input{ border:none; outline:none; background:transparent; font-family:inherit; font-size:13.5px; color:var(--ink); width:100%; }
  .search svg{ flex:none; opacity:0.5; }
  .filterpills{ display:flex; gap:6px; flex-wrap:wrap; }
  .fpill{ appearance:none; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-family:inherit; font-weight:700; font-size:12.5px; padding:7px 13px; border-radius:999px; cursor:pointer; }
  .fpill.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .roster{ display:flex; flex-direction:column; gap:8px; }
  .prow{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden; }
  .prow-head{ display:grid; grid-template-columns:28px 1.3fr 1fr 1.4fr 0.9fr 20px; gap:12px; align-items:center; padding:13px 16px; cursor:pointer; }
  @media (max-width:760px){ .prow-head{ grid-template-columns:24px 1fr 20px; } .prow-head .col-ldap,.prow-head .col-disability,.prow-head .col-join{ display:none; } }
  .avatar{ width:28px; height:28px; border-radius:50%; background:var(--blue-tint); color:var(--blue-ink); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12px; }
  .pname{ font-weight:800; font-size:14.5px; }
  .pldap{ font-size:12px; color:var(--muted); font-family:"Bricolage Grotesque"; }
  .badge{ display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:999px; background:var(--paper-2); color:var(--ink-soft); border:1px solid var(--line); white-space:nowrap; }
  .badge.spot{ background:var(--green-tint); color:var(--green-ink); border-color:transparent; }
  .pjoin{ font-size:12px; color:var(--muted); }
  .chev{ transition:transform .18s ease; color:var(--muted); }
  .prow.open .chev{ transform:rotate(180deg); }
  .prow-body{ display:none; padding:0 16px 18px; border-top:1px solid var(--line); }
  .prow.open .prow-body{ display:block; }
  .pbody-grid{ display:grid; grid-template-columns:1.1fr 1fr; gap:18px; padding-top:16px; }
  @media (max-width:760px){ .pbody-grid{ grid-template-columns:1fr; } }
  .pbody-card{ background:var(--paper-2); border-radius:var(--radius-sm); padding:14px 16px; }
  .pbody-card h4{ margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); font-weight:800; }
  .schedule-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .schedule-table th{ text-align:left; font-weight:700; color:var(--muted); font-size:11px; padding:5px 6px; border-bottom:1px solid var(--line); }
  .schedule-table td{ padding:6px 6px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  .schedule-note{ font-size:11.5px; color:var(--muted); margin-top:8px; line-height:1.5; }
  .kv{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px dashed var(--line); font-size:12.5px; }
  .kv:last-child{ border-bottom:none; }
  .kv .k{ color:var(--muted); font-weight:600; }
  .kv .v{ font-weight:700; text-align:right; }
  .timeline{ display:flex; flex-direction:column; gap:8px; }
  .tl-item{ display:flex; gap:10px; align-items:flex-start; font-size:12.5px; }
  .tl-dot{ width:8px; height:8px; border-radius:50%; margin-top:4px; flex:none; }
  .tl-dot.done{ background:var(--good); }
  .tl-dot.pending{ background:var(--warn); }
  .tl-main{ font-weight:700; }
  .tl-sub{ color:var(--muted); font-size:11.5px; }

  /* Tab2 */
  .kpirow{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  @media (max-width:820px){ .kpirow{ grid-template-columns:repeat(2,1fr); } }
  .kpi{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px; }
  .kpi .klabel{ font-size:12px; color:var(--muted); font-weight:700; margin-bottom:6px; }
  .kpi .kval{ font-size:26px; font-weight:800; letter-spacing:-0.02em; }
  .kpi .kval small{ font-size:14px; font-weight:700; color:var(--muted); margin-left:2px;}
  .kpi .ktrend{ font-size:11.5px; font-weight:700; margin-top:4px; }
  .ktrend.up{ color:var(--good); } .ktrend.down{ color:var(--crit); } .ktrend.flat{ color:var(--muted); }

  .spotpills{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .spotpill{ appearance:none; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--ink); font-family:inherit; font-weight:800; font-size:13px; padding:10px 16px; border-radius:999px; display:flex; align-items:center; gap:8px; }
  .spotpill .dot{ width:9px; height:9px; border-radius:50%; }
  .spotpill.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .spotpill .count{ font-size:11px; font-weight:700; opacity:0.65; }

  .chart-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md); padding:18px 20px 10px; }
  .chart-card h3{ font-size:14px; font-weight:800; margin-bottom:2px; }
  .chart-card .sub{ font-size:11.5px; color:var(--muted); margin-bottom:10px; }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:8px; }
  .legend .li{ display:flex; align-items:center; gap:6px; }
  .legend .sw{ width:10px; height:10px; border-radius:3px; }

  .donut-wrap{ display:flex; align-items:center; gap:28px; flex-wrap:wrap; padding:6px 0 14px; }
  .donut-wrap svg{ flex:none; }
  .donut-legend{ flex:1; min-width:200px; display:flex; flex-direction:column; gap:2px; }
  .donut-row{ display:grid; grid-template-columns:10px 1fr auto auto; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--line); font-size:13px; }
  .donut-row:last-child{ border-bottom:none; }
  .dsw{ width:10px; height:10px; border-radius:50%; }
  .dlabel{ font-weight:700; }
  .dpct{ font-weight:800; min-width:38px; text-align:right; }
  .dcount{ color:var(--muted); font-size:12px; min-width:44px; text-align:right; }
  .barsvg{ width:100%; height:auto; display:block; overflow:visible; }
  .barsvg .axislabel{ font-size:10px; font-weight:600; fill:var(--muted); font-family:"Gothic A1",sans-serif; }
  .barsvg .trendtotal{ font-size:10px; font-weight:700; fill:var(--ink-soft); font-family:"Gothic A1",sans-serif; }
  .barsvg .grid{ stroke:var(--line); stroke-width:1; }
  .barsvg rect.seg{ cursor:default; }
  .barsvg rect.seg:hover{ filter:brightness(1.08); }
  .barsvg rect.seghit{ cursor:pointer; fill:transparent; transition:fill .1s ease; }
  .barsvg rect.seghit:hover{ fill:color-mix(in srgb, var(--ink) 10%, transparent); }
  .trendhint{ font-size:11px; color:var(--muted); font-weight:600; margin-top:8px; }
  .negpanel{ margin-top:16px; padding-top:16px; border-top:1px dashed var(--line); }
  .negpanel[hidden]{ display:none; }
  .negpanel-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .negpanel-title{ font-size:13px; font-weight:800; }
  .negpanel-count{ color:var(--muted); font-weight:700; margin-left:4px; }
  .negpanel-close{ appearance:none; border:1px solid var(--line); background:var(--paper-2); color:var(--ink-soft); font-family:inherit; font-weight:700; font-size:11.5px; padding:6px 12px; border-radius:999px; cursor:pointer; flex:none; }
  .negpanel-body{ display:flex; flex-direction:column; gap:10px; max-height:380px; overflow-y:auto; padding-right:4px; }
  .negitem{ background:var(--paper-2); border-radius:var(--radius-sm); padding:12px 14px; }
  .negitem-head{ display:flex; justify-content:space-between; gap:10px; margin-bottom:6px; font-size:11.5px; font-weight:800; color:var(--ink-soft); }
  .negitem-date{ color:var(--muted); font-weight:600; }
  .negitem-text{ font-size:12.5px; line-height:1.65; color:var(--ink); }

  .tooltip{ position:fixed; pointer-events:none; background:var(--ink); color:var(--paper); font-size:11.5px; font-weight:600; padding:7px 10px; border-radius:8px; z-index:50; opacity:0; transform:translateY(4px); transition:opacity .1s ease; line-height:1.5; white-space:nowrap; }
  .tooltip.show{ opacity:1; }

  table.datatable{ width:100%; min-width:560px; border-collapse:collapse; font-size:13px; }
  table.datatable th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); font-weight:800; padding:8px 10px; border-bottom:1px solid var(--line); }
  table.datatable td{ padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.datatable tr:last-child td{ border-bottom:none; }
  .ratiobar{ width:70px; height:6px; border-radius:4px; background:var(--paper-2); overflow:hidden; display:inline-block; vertical-align:middle; margin-right:8px; }
  .ratiobar > span{ display:block; height:100%; background:var(--good); }
  .spark{ display:flex; align-items:flex-end; gap:2px; height:24px; }
  .spark i{ display:block; width:5px; background:var(--blue); border-radius:1.5px 1.5px 0 0; opacity:0.85; }

  .emptystate{ text-align:center; padding:50px 20px; color:var(--muted); }
  .emptystate .glyph{ font-size:30px; margin-bottom:10px; }
  .emptystate h3{ color:var(--ink); font-size:16px; margin-bottom:6px; }
  .emptystate p{ font-size:12.5px; margin:0; }

  .callout{ display:flex; gap:10px; align-items:flex-start; background:var(--green-tint); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; font-size:12px; color:var(--ink-soft); margin-top:14px; line-height:1.6; }
  .callout b{ color:var(--ink); }

  footer.foot{ text-align:center; color:var(--muted); font-size:11.5px; padding:30px 0 10px; }

  a{ color:inherit; }
  ::selection{ background:var(--blue-light); color:var(--blue-ink); }

  .sidefab{ position:fixed; top:50%; right:18px; transform:translateY(-50%); display:flex; flex-direction:column; gap:10px; z-index:40; }
  .fabbtn{ width:44px; height:44px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; box-shadow:0 4px 14px rgba(24,26,25,0.12); transition:transform .15s ease, background .15s ease; padding:0; font-family:inherit; }
  .fabbtn:hover{ background:var(--paper-2); transform:scale(1.07); }
  .fabbtn:active{ transform:scale(0.92); }
  .fabbtn.spin{ animation:fabspin .5s ease; }
  @keyframes fabspin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
  @media (max-width:820px){ .sidefab{ right:10px; top:auto; bottom:20px; transform:none; flex-direction:column; } .fabbtn{ width:40px; height:40px; font-size:16px; } }
  @media (prefers-reduced-motion: reduce){ .fabbtn.spin{ animation:none; } }

  .gate-overlay{ position:fixed; inset:0; z-index:100; background:var(--paper); display:flex; align-items:center; justify-content:center; padding:20px; }
  .gate-card{ width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:34px 28px; box-shadow:0 20px 50px rgba(24,26,25,0.14); display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; }
  .gate-mark{ width:44px; height:44px; border-radius:12px; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; font-family:"Bricolage Grotesque"; margin-bottom:10px; }
  .gate-card h1{ font-size:17px; font-weight:800; letter-spacing:-0.01em; }
  .gate-desc{ font-size:12.5px; color:var(--muted); margin:6px 0 18px; line-height:1.5; }
  .gate-input{ width:100%; box-sizing:border-box; border:1px solid var(--line); background:var(--paper-2); color:var(--ink); border-radius:var(--radius-sm); padding:12px 14px; font-size:14px; font-family:inherit; text-align:center; letter-spacing:0.03em; }
  .gate-input:focus{ outline:2px solid var(--blue); outline-offset:1px; }
  .gate-btn{ width:100%; margin-top:12px; border:none; background:var(--ink); color:var(--paper); font-family:inherit; font-weight:800; font-size:13.5px; padding:12px 14px; border-radius:var(--radius-sm); cursor:pointer; }
  .gate-btn:disabled{ opacity:0.6; cursor:default; }
  .gate-btn:hover:not(:disabled){ filter:brightness(1.12); }
  .gate-error{ font-size:12px; color:var(--crit); font-weight:700; margin-top:12px; }
  html.locked .shell, html.locked .sidefab{ display:none; }
</style>
</head>
<body>
<div class="gate-overlay" id="gateOverlay">
  <form class="gate-card" id="gateForm">
    <div class="gate-mark">H</div>
    <h1>헬스케어파트 컴트롤루</h1>
    <div class="gate-desc">비밀번호를 입력하면 대시보드를 볼 수 있어요</div>
    <input type="password" id="gatePassword" class="gate-input" placeholder="비밀번호" autocomplete="current-password" required>
    <button type="submit" class="gate-btn" id="gateSubmit">입장하기</button>
    <div class="gate-error" id="gateError" hidden>비밀번호가 올바르지 않습니다. 다시 시도해 주세요.</div>
  </form>
</div>
<div class="shell">
  <div class="topbar">
    <div class="brand">
      <div class="mark">H</div>
      <div>
        <div class="name">헬스케어파트 컨트롤룸</div>
        <div class="sub">인적사항·서비스 &amp; 모니터링 취합</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">

function bucket(counts){
  const b={pos:0,neu:0,neg:0};
  Object.entries(counts||{}).forEach(([k,v])=>{ if(!k) return; b[sentiment(k)]+=v; });
  return b;
}
function avg2(sum,n){ return n>0 ? (sum/n) : null; }
const tipEl = document.getElementById('tooltip');
function showTip(evt,html){
  tipEl.innerHTML = html;
  tipEl.classList.add('show');
  moveTip(evt);
}
function moveTip(evt){
  const pad=14;
  let x=evt.clientX+pad, y=evt.clientY+pad;
  tipEl.style.left = x+'px';
  tipEl.style.top = y+'px';
}
function hideTip(){ tipEl.classList.remove('show'); }

const SPOT_COLOR_VAR = {"페이":"--spot-a","모빌리티":"--spot-b","게임즈":"--spot-a","판교 톡클리닉":"--spot-b","제주 톡클리닉":"--spot-a"};
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function overallStats(){
  let totalResp=0, sumScore=0, scoredCount=0, pos=0,neu=0,neg=0, activeSpots=0;
  SPOT_ORDER.forEach(spot=>{
    const d = MONITORING[spot];
    if(!d || !d.totalResponses){ return; }
    activeSpots++;
    totalResp += d.totalResponses;
    Object.values(d.monthly).forEach(m=>{
      sumScore+=m.sumScore; scoredCount+=m.scoredCount;
      const b=bucket(m.counts); pos+=b.pos; neu+=b.neu; neg+=b.neg;
    });
  });
  const posRatio = (pos+neu+neg)>0 ? Math.round(pos/(pos+neu+neg)*100) : null;
  return {totalResp, avg: avg2(sumScore,scoredCount), posRatio, activeSpots};
}

function monthLabel(m){ return m+'월'; }

const SENT_ORDER = ['매우 만족','만족','약간 만족','보통','약간 불만족','불만족','매우 불만족'];
const SENT_COLOR = {
  '매우 만족':'var(--blue)', '만족':'var(--blue-light)', '약간 만족':'var(--blue-light)',
  '보통':'var(--green)',
  '약간 불만족':'var(--neutral)', '불만족':'var(--neutral-dark)', '매우 불만족':'var(--neutral-dark)'
};

function satisfactionDonut(monthlyObj, size){
  const totals = {};
  Object.values(monthlyObj).forEach(m=>{
    Object.entries(m.counts||{}).forEach(([k,v])=>{ if(!k) return; totals[k]=(totals[k]||0)+v; });
  });
  const segs = SENT_ORDER.filter(k=>totals[k]>0).map(k=>({label:k, value:totals[k], color:SENT_COLOR[k]}));
  const total = segs.reduce((a,s)=>a+s.value,0);
  if(total===0) return '<div class="schedule-note">집계할 만족도 응답이 없습니다.</div>';

  const S = size||176, sw=30, r=(S-sw)/2, cx=S/2, cy=S/2, C=2*Math.PI*r, GAP=segs.length>1?3:0;
  let offset=0, rings='';
  segs.forEach(s=>{
    const frac = s.value/total;
    const len = Math.max(0, frac*C - GAP);
    rings += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}"
      stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})" stroke-linecap="round" class="seg"
      onmousemove="moveTip(event)" onmouseenter="showTip(event,'${esc(s.label)} · '+${s.value}+'건 ('+${Math.round(s.value/total*100)}+'%)')" onmouseleave="hideTip()"></circle>`;
    offset += frac*C;
  });
  const legend = segs.slice().sort((a,b)=>b.value-a.value).map(s=>`
    <div class="donut-row">
      <span class="dsw" style="background:${s.color}"></span>
      <span class="dlabel">${esc(s.label)}</span>
      <span class="dpct num">${Math.round(s.value/total*100)}%</span>
      <span class="dcount num">${s.value}건</span>
    </div>`).join('');
  return `
  <div class="donut-wrap">
    <svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">${rings}</svg>
    <div class="donut-legend">${legend}</div>
  </div>`;
}

function monthlyTrendMini(spot, monthlyObj){
  const months = monthsOf(monthlyObj);
  if(months.length===0) return '';
  const present = SENT_ORDER.filter(k => months.some(m => (monthlyObj[m].counts||{})[k] > 0));
  const hasNeg = present.some(k=>sentiment(k)==='neg');
  const W=680,H=210,padL=8,padR=8,padB=26,padT=22;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const bw = plotW/months.length;
  const barW = Math.min(46, bw*0.56);
  const maxTotal = Math.max(1, ...months.map(m=>present.reduce((a,k)=>a+((monthlyObj[m].counts||{})[k]||0),0)));
  const MIN_HIT_H = 14; // guarantees a comfortably clickable target even when the real segment is a 1-2px sliver
  const MIN_SEG_H = 4; // guarantees every present category renders a visible sliver, even at a tiny share of the bar
  let bars='', hits='';
  months.forEach((m,i)=>{
    const cx = padL+bw*i+bw/2;
    let y = padT+plotH;
    const negSegs = []; // collected here, laid out as non-overlapping hit zones after the stack is built

    // first pass: raw proportional heights for each present category this month
    const segs = [];
    present.forEach(k=>{
      const val = (monthlyObj[m].counts||{})[k]||0;
      if(val<=0) return;
      segs.push({k, val, h:(val/maxTotal)*plotH});
    });
    // redistribute height so no non-zero category drops below MIN_SEG_H, borrowing space from the
    // larger categories — this keeps the bar's total height (and month-over-month comparison) unchanged,
    // it only prevents a small-but-real category from shrinking into an invisible sliver
    let deficit = 0, donors = 0;
    segs.forEach(s=>{ if(s.h < MIN_SEG_H) deficit += (MIN_SEG_H - s.h); else donors += s.h; });
    const shrink = (deficit > 0 && donors > 0) ? Math.max(0, (donors - deficit) / donors) : 1;
    segs.forEach(s=>{ s.hAdj = (s.h < MIN_SEG_H) ? MIN_SEG_H : s.h * shrink; });

    segs.forEach(({k, val, hAdj})=>{
      y -= hAdj;
      const neg = sentiment(k)==='neg';
      const visH = Math.max(0, hAdj-1.5);
      const tip = `'${monthLabel(m)} · ${esc(k)} '+${val}+'건'`;
      if(neg){
        // visible sliver is decorative only — a separate, non-overlapping hit-rect (laid out below) carries the interaction
        bars += `<rect class="seg neg" x="${(cx-barW/2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${visH.toFixed(1)}" rx="3" fill="${SENT_COLOR[k]}"></rect>`;
        negSegs.push({k, y, visH, tip});
      } else {
        bars += `<rect class="seg" x="${(cx-barW/2).toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${visH.toFixed(1)}" rx="3" fill="${SENT_COLOR[k]}"
          onmousemove="moveTip(event)" onmouseenter="showTip(event,${tip})" onmouseleave="hideTip()"></rect>`;
      }
    });
    if(negSegs.length){
      // stack each negative category's hit zone edge-to-edge (never overlapping), centered on where the cluster visually sits
      const clusterTop = Math.min(...negSegs.map(s=>s.y));
      const clusterBottom = Math.max(...negSegs.map(s=>s.y+s.visH));
      const totalH = negSegs.length * MIN_HIT_H;
      let cursorY = Math.max(padT, (clusterTop+clusterBottom)/2 - totalH/2);
      negSegs.slice().sort((a,b)=>a.y-b.y).forEach(s=>{ // topmost-on-screen first
        hits += `<rect class="seghit" x="${(cx-barW/2-3).toFixed(1)}" y="${cursorY.toFixed(1)}" width="${(barW+6).toFixed(1)}" height="${MIN_HIT_H.toFixed(1)}" rx="4" fill="transparent" pointer-events="all"
          onmousemove="moveTip(event)" onmouseenter="showTip(event,${s.tip})" onmouseleave="hideTip()" onclick="showNegComments('${esc(spot)}',${m},'${esc(s.k)}')"></rect>`;
        cursorY += MIN_HIT_H;
      });
    }
    const monthTotal = (monthlyObj[m].total!=null) ? monthlyObj[m].total : present.reduce((a,k)=>a+((monthlyObj[m].counts||{})[k]||0),0);
    const totalY = Math.max(13, y-6);
    bars += `<text class="trendtotal" x="${cx}" y="${totalY.toFixed(1)}" text-anchor="middle">${monthTotal}건</text>`;
    bars += `<text class="axislabel" x="${cx}" y="${H-7}" text-anchor="middle">${monthLabel(m)}</text>`;
  });
  const legend = present.map(k=>`<span class="li"><span class="sw" style="background:${SENT_COLOR[k]}"></span>${esc(k)}</span>`).join('');
  return `
  <div class="legend">${legend}</div>
  <svg class="barsvg" viewBox="0 0 ${W} ${H}">
    <line class="grid" x1="0" y1="${padT+plotH}" x2="${W}" y2="${padT+plotH}"></line>
    ${bars}
    ${hits}
  </svg>
  ${hasNeg ? `<div class="trendhint">💬 약간불만족·불만족·매우불만족 막대를 클릭하면 해당 월의 의견을 확인할 수 있어요</div>` : ''}
  <div id="negPanel" class="negpanel" hidden></div>`;
}

function showNegComments(spot, month, cat){
  const panel = document.getElementById('negPanel');
  if(!panel) return;
  const list = (NEGATIVE_COMMENTS[spot]||[]).filter(c => c.month===month && c.sat===cat);
  const body = list.length===0
    ? `<div class="schedule-note">해당 구간에 기록된 의견이 없습니다.</div>`
    : list.map(c => `
      <div class="negitem">
        <div class="negitem-head">
          <span class="negitem-person">${c.person ? esc(c.person) : '익명'}</span>
          <span class="negitem-date">${monthLabel(c.month)} ${c.day}일</span>
        </div>
        <div class="negitem-text">${c.comment ? esc(c.comment).replace(/\n/g,'<br>') : '<span style="color:var(--muted);">작성된 의견 없음</span>'}</div>
      </div>`).join('');
  panel.innerHTML = `
    <div class="negpanel-head">
      <div class="negpanel-title">${esc(spot)} · ${monthLabel(month)} · ${esc(cat)} <span class="num negpanel-count">${list.length}건</span></div>
      <button class="negpanel-close" onclick="document.getElementById('negPanel').hidden=true;">닫기 ✕</button>
    </div>
    <div class="negpanel-body">${body}</div>`;
  panel.hidden = false;
  panel.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function spotKPIrow(spot){
  const d = MONITORING[spot];
  let sumScore=0, scoredCount=0, pos=0,neu=0,neg=0;
  Object.values(d.monthly).forEach(m=>{ sumScore+=m.sumScore; scoredCount+=m.scoredCount; const b=bucket(m.counts); pos+=b.pos;neu+=b.neu;neg+=b.neg; });
  const avg = avg2(sumScore,scoredCount);
  const ratio = (pos+neu+neg)>0? Math.round(pos/(pos+neu+neg)*100) : null;
  return `
  <div class="kpirow" style="margin-bottom:16px;">
    <div class="kpi"><div class="klabel">총 응답</div><div class="kval num">${d.totalResponses}<small>건</small></div></div>
    <div class="kpi"><div class="klabel">평균 만족도</div><div class="kval num">${avg?avg.toFixed(2):'—'}<small>/5</small></div></div>
    <div class="kpi"><div class="klabel">긍정 비율</div><div class="kval num">${ratio!=null?ratio:'—'}<small>%</small></div></div>
    <div class="kpi"><div class="klabel">응답 헬스키퍼/룸</div><div class="kval num">${Object.keys(d.byPerson||{}).length}<small>명</small></div></div>
  </div>`;
}

function personSpark(monthlyObj){
  const vals = MONTH_RANGE_ARR.map(m=> monthlyObj[m]? monthlyObj[m].total : 0);
  const max = Math.max(1,...vals);
  return `<div class="spark">${vals.map(v=>`<i style="height:${Math.max(2,v/max*24).toFixed(0)}px" title="${v}건"></i>`).join('')}</div>`;
}

function personTableHTML(spot){
  const d = MONITORING[spot];
  const people = Object.entries(d.byPerson||{});
  if(people.length===0) return '<div class="schedule-note">이 스팟은 응답에 room/헬스키퍼 정보가 기재되지 않았습니다.</div>';
  people.sort((a,b)=>b[1].total-a[1].total);
  const rows = people.map(([name,pd])=>{
    const b = bucket(pd.counts);
    const ratio = (b.pos+b.neu+b.neg)>0? Math.round(b.pos/(b.pos+b.neu+b.neg)*100) : null;
    const avg = avg2(pd.sumScore,pd.scoredCount);
    return `<tr>
      <td><strong>${esc(name)}</strong></td>
      <td class="num">${pd.total}건</td>
      <td class="num">${avg?avg.toFixed(2):'—'}</td>
      <td><span class="ratiobar"><span style="width:${ratio||0}%"></span></span><span class="num">${ratio!=null?ratio+'%':'—'}</span></td>
      <td>${personSpark(pd.monthly)}</td>
    </tr>`;
  }).join('');
  return `
  <div style="overflow-x:auto;">
    <table class="datatable">
      <thead><tr><th>Room / 헬스키퍼</th><th>총 응답</th><th>평균 만족도</th><th>긍정 비율</th><th>월별 추이(${MONTH_RANGE_LABEL})</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

let activeSpot = "페이";
function spotPanelHTML(spot){
  const d = MONITORING[spot];
  if(!d || !d.totalResponses){
    return `<div class="emptystate">
      <div class="glyph">🌴</div>
      <h3>${esc(spot)} — 접수된 응답 없음</h3>
      <p>2026년 ${MONTH_RANGE_LABEL} 기준 해당 스팟 시트에 응답 데이터가 없습니다. 서비스 오픈/설문 배포 여부를 확인해 주세요.</p>
    </div>`;
  }
  const personFilled = Object.values(d.byPerson||{}).reduce((a,p)=>a+p.total,0);
  const caveat = (d.totalResponses>0 && personFilled/d.totalResponses < 0.3)
    ? `<div class="callout"><span>💡</span><div><b>참고</b> — ${esc(spot)}은 ${d.totalResponses}건 응답 중 Room/헬스키퍼가 기재된 응답이 ${personFilled}건뿐이라 인원별 통계는 참고용입니다. 스팟 전체 통계를 우선 확인하세요.</div></div>`
    : '';
  return `
    ${spotKPIrow(spot)}
    <div class="chart-card">
      <h3>만족도 구성</h3>
      <div class="sub">${MONTH_RANGE_LABEL} 누적 응답 기준</div>
      ${satisfactionDonut(d.monthly)}
    </div>
    <div class="chart-card" style="margin-top:14px;">
      <h3>월별 응답 추이</h3>
      <div class="sub">매우만족–약간만족–보통–약간불만족–매우불만족 구성</div>
      ${monthlyTrendMini(spot, d.monthly)}
    </div>
    <div class="chart-card" style="margin-top:14px;">
      <h3>Room / 헬스키퍼별 통계</h3>
      <div class="sub">월별 만족도 개수 · 평균 · 긍정비율</div>
      ${personTableHTML(spot)}
      ${caveat}
    </div>
  `;
}

function renderSpotSwitcher(){
  return `<div class="spotpills">
    ${SPOT_ORDER.map(spot=>{
      const total = (MONITORING[spot]&&MONITORING[spot].totalResponses)||0;
      return `<button class="spotpill ${activeSpot===spot?'active':''}" onclick="activeSpot='${esc(spot)}'; rerenderSpotPanel();">
        <span class="dot" style="background:var(${SPOT_COLOR_VAR[spot]})"></span>${esc(spot)} <span class="count">${total}건</span>
      </button>`;
    }).join('')}
  </div>`;
}

function rerenderSpotPanel(){
  document.querySelectorAll('.spotpill').forEach(b=>b.classList.remove('active'));
  const idx = SPOT_ORDER.indexOf(activeSpot);
  document.querySelectorAll('.spotpill')[idx].classList.add('active');
  document.getElementById('spotPanel').innerHTML = spotPanelHTML(activeSpot);
}

function renderMonitorSpotSection(){
  return `
  <section class="block">
    <div class="block-head">
      <h2>스팟별 상세</h2>
      <div class="desc">스팟을 선택해 월별 추이와 인원별 통계를 확인하세요</div>
    </div>
    ${renderSpotSwitcher()}
    <div id="spotPanel">${spotPanelHTML(activeSpot)}</div>
  </section>`;
}

function renderMonitorView(){
  document.getElementById('view-monitor').innerHTML =
    renderMonitorOverview() + spotComparisonHTML() + renderMonitorSpotSection();
}

const BUILD_DATE = '2026-09-15';

function initApp(parsed){
  PERSONNEL = parsed.personnel;
  MONITORING = parsed.monitoring;
  NEGATIVE_COMMENTS = parsed.negcomments;
  MAX_MONTH = Math.max(1, ...Object.values(MONITORING).flatMap(d => Object.keys(d.monthly||{}).map(Number)));
  MONTH_RANGE_LABEL = `1–${MAX_MONTH}월`;
  MONTH_RANGE_ARR = Array.from({length: MAX_MONTH}, (_,i)=>i+1);

  renderPeopleView();
  renderMonitorView();

  const el = document.getElementById('lastUpdatedNote');
  if(el) el.textContent = `이 게시본 데이터 취합 시각: ${BUILD_DATE} · 원본 시트가 바뀌면 다시 취합을 요청해 주세요`;
  const rangeEl = document.getElementById('dataRangeNote');
  if(rangeEl) rangeEl.textContent = `2026.01–2026.${String(MAX_MONTH).padStart(2,'0')}`;

  document.documentElement.classList.remove('locked');
  const gate = document.getElementById('gateOverlay');
  if(gate) gate.remove();
}

/* ---------- theme toggle (light / dark / system) ---------- */
(function(){
  const root = document.documentElement;
  const btn = document.getElementById('themeToggleBtn');
  if(!btn) return;
  function systemPrefersDark(){
    try{ return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return false; }
  }
  function getStored(){ try{ return localStorage.getItem('hc-theme'); }catch(e){ return null; } }
  function setStored(v){ try{ localStorage.setItem('hc-theme', v); }catch(e){} }
  function apply(theme){
    if(theme==='dark'){ root.setAttribute('data-theme','dark'); btn.textContent='☀️'; }
    else if(theme==='light'){ root.setAttribute('data-theme','light'); btn.textContent='🌙'; }
    else{ root.removeAttribute('data-theme'); btn.textContent = systemPrefersDark() ? '☀️' : '🌙'; }
  }
  let current = getStored() || 'system';
  apply(current);
  btn.addEventListener('click', function(){
    const isDarkNow = current==='dark' || (current==='system' && systemPrefersDark());
    current = isDarkNow ? 'light' : 'dark';
    setStored(current);
    apply(current);
  });
})();

/* ---------- refresh button: reloads to pick up the latest published version of this page ---------- */
(function(){
  const btn = document.getElementById('refreshBtn');
  if(!btn) return;
  btn.addEventListener('click', function(){
    btn.classList.add('spin');
    btn.disabled = true;

/* ---------- password gate: payload is AES-256-GCM encrypted client-side; decrypted only after a correct password ---------- */
(function(){
  const form = document.getElementById('gateForm');
  const input = document.getElementById('gatePassword');
  const errorEl = document.getElementById('gateError');
  const btn = document.getElementById('gateSubmit');
  if(!form) return;

  function b64ToBytes(b64){
    const bin = atob(b64);
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return arr;
  }

  async function deriveKey(password, salt, iterations){
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      {name:'PBKDF2', salt, iterations, hash:'SHA-256'},
      baseKey,
      {name:'AES-GCM', length:256},
      false,
      ['decrypt']
    );
  }

  async function tryUnlock(password){
    const payloadEl = document.getElementById('encrypted-payload');
    const payload = JSON.parse(payloadEl.textContent);
    const salt = b64ToBytes(payload.salt);
    const iv = b64ToBytes(payload.iv);
    const data = b64ToBytes(payload.data);
    const key = await deriveKey(password, salt, payload.iterations);
    const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
    const text = new TextDecoder().decode(plainBuf);
    return JSON.parse(text);
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    errorEl.hidden = true;
    btn.disabled = true;
    btn.textContent = '확인 중…';
    tryUnlock(input.value).then(function(parsed){
      initApp(parsed);
    }).catch(function(){
      errorEl.hidden = false;
      btn.disabled = false;
      btn.textContent = '입장하기';
      input.value = '';
      input.focus();
    });
  });
})();
</script>
